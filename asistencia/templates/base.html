<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Asistencia{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Header con menú -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
      <div class="container-fluid">
        
        <!-- Logo + Nombre -->
        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
          <img src="{% static 'imagenes/escudo.png' %}" alt="Escudo" width="70" height="60" class="me-2">
          <span>Institución Educativa Técnica San Luis</span>
        </a>

        <!-- Botón responsive (hamburguesa en móvil) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Opciones -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="#">Eventos</a>
            </li>
            
            {% if user.is_authenticated %}
              <li class="nav-item">
                <span class="nav-link">Hola, {{ user.username }}</span>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'logout' %}">Cerrar sesión</a>
              </li>
            {% else %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'registro' %}">Iniciar sesión</a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Contenido de cada página -->
  <main class="container-fluid p-0">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<style>
  /* Nombre institución en rojo */
  .navbar-brand span {
    color: red;
    font-weight: bold;
    font-size: 1.7rem;
  }

  /* Links normales en negro */
  .navbar-nav .nav-link {
    color: black !important;
    font-size: 1.4rem;
  }

  /* Hover en rojo */
  .navbar-nav .nav-link:hover {
    color: red !important;
  }
  .bg-secondary {
    background-color: #beb9b9 !important; /* más claro */
  }

</style>
